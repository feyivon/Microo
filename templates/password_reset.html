{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="our_mics">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3" style="padding-bottom: 80px;">

                <div class="titlepage text_align_center">
                    <h2>Forgot Password?</h2>
                    <p>Enter your email address and we will send you a link to reset your password</p>
                </div>

                <!-- Messages -->
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}

                <div style="border: 2px solid purple;
                            border-radius: 15px;
                            padding: 30px;
                            margin-top: 20px;">

                    <form method="POST" action="{% url 'password_reset' %}">
                        {% csrf_token %}

                        <!-- Email -->
                        <div class="form-group mb-3">
                            <label style="font-weight: bold;">Email Address</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your registered email"
                                   style="border: 2px solid purple;
                                          border-radius: 10px;
                                          padding: 10px;
                                          width: 100%;"/>
                        </div>

                        <!-- Submit -->
                        <button type="submit"
                                class="btn btn-block mt-3"
                                style="background: linear-gradient(to right, red, purple);
                                       color: #fff;
                                       border-radius: 25px;
                                       padding: 12px;
                                       width: 100%;
                                       font-weight: bold;
                                       font-size: 16px;">
                            Send Reset Link
                        </button>

                        <p class="text-center mt-3">
                            Remember your password?
                            <a href="{% url 'login' %}"
                               style="color: purple; font-weight: bold;">
                                Login here
                            </a>
                        </p>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
