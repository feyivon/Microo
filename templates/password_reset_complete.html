{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="our_mics">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3" style="padding-bottom: 80px;">

                <div class="titlepage text_align_center">
                    <h2>✅ Password Reset Successful!</h2>
                </div>

                <div style="border: 2px solid purple;
                            border-radius: 15px;
                            padding: 30px;
                            margin-top: 20px;
                            text-align: center;">

                    <p style="font-size: 16px; color: #555; line-height: 1.8;">
                        Your password has been reset successfully.
                        You can now login with your new password.
                    </p>

                    <hr style="border-color: purple;">

                    <a href="{% url 'login' %}"
                       class="btn mt-2"
                       style="background: linear-gradient(to right, red, purple);
                              color: #fff;
                              border-radius: 25px;
                              padding: 12px 40px;
                              font-weight: bold;
                              font-size: 16px;">
                        Login Now
                    </a>

                </div>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
